<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Шпоры</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:#000;color:#e0e0e0;
  font-family:system-ui,-apple-system,sans-serif;
  font-size:20px;line-height:1.7;
  padding:24px max(22px,14%);
  -webkit-tap-highlight-color:transparent;
}
h1{font-size:26px;color:#80cbc4;text-align:center;padding:16px 0 8px 0;}
.subject-link{
  display:block;padding:18px 14px;margin-bottom:10px;
  color:#fff;text-decoration:none;font-size:20px;font-weight:bold;
  line-height:1.5;border-radius:12px;background:#0a0a0a;
  min-height:56px;border:1px solid #333;text-align:center;
}
.subject-link:active{background:#1a3a36;}
.subject-count{color:#80cbc4;font-size:16px;font-weight:normal;}
.subject-tasks{color:#ef9a9a;font-size:16px;font-weight:normal;}
</style>
</head>
<body>
<h1>Шпоры</h1>

<a href="land-law/" class="subject-link">
  Земельное право — Билеты
  <span class="subject-count">62 билета</span>
</a>

<a href="land-law/land-law-tasks/" class="subject-link">
  Земельное право — Задачи
  <span class="subject-tasks">29 задач</span>
</a>

<a href="fin-law/" class="subject-link">
